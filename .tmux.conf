set-option -g default-command /bin/zsh

# Change prefix to Ctrl+q
set-option -g prefix C-q
unbind C-b
bind C-q send-prefix

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g allow-passthrough on

# set -g window-size latest
# setw -g aggressive-resize on

set-option -g mouse on
bind-key m if-shell "tmux show-options -g mouse | grep off" "set-option -g mouse on" "set-option -g mouse off"
unbind -T copy-mode MouseDragEnd1Pane
bind-key -T copy-mode Enter send-keys -X copy-pipe "tmux copy-buffer"
bind-key -T copy-mode v send-keys -X begin-selection

set-window-option -g word-separators ' @'

# ステータスバー配置
set-option -g status-position top

# ペインのステータスラインにgitのブランチとかディレクトリとか表示する
set-option -g pane-border-status bottom
set-option -g pane-border-format "#[fg=black,bg=blue] #P #(tmux-pane-border '#{pane_current_path}')"
set-option -g pane-border-style fg="colour023"

# 左右のステータスバーの長さを決定する
set-option -g status-left-length 90
set-option -g status-right-length 90

# #P => ペイン番号
# 最左に表示
set-option -g status-left '[#P]'

# Wi-Fi、バッテリー残量、現在時刻
# 最右に表示
# set-option -g status-right '#(wifi) #(battery --tmux) [%Y-%m-%d(%a) %H:%M]'
# set-option -g status-bg "colour113"

# ステータスバーを設定秒毎に描画し直す
# set-option -g status-interval 30

# センタライズ（主にウィンドウ番号など）
set-option -g status-justify centre

# Esc入力時の待ち時間をキャンセル
set-option -s escape-time 0

#set inactive/active window styles
set -g window-style 'fg=colour247,bg=default'
set -g window-active-style 'fg=colour250,bg=colour234'

# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=default'
set -g pane-active-border-style 'fg=colour51,bg=default'

# rで設定読み込み
bind r source-file ~/.tmux.conf \; display "Config reloaded."

# スクロール行
set-option -g history-limit 100000

## viのキーバインドを使用
setw -g mode-keys vi

# Vi キーバインド
set-window-option -g mode-keys vi

# Esc キーでコピーの反転を解除（コピーモードは抜けない）
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
# Ctrl-c キーでコピーの反転を解除し、コピーモードから抜ける
bind-key -T copy-mode-vi C-c  send-keys -X cancel

# コピーモード中（Prefix+v 後）C-v で矩形選択開始
bind-key -T copy-mode-vi C-v  send-keys -X rectangle-toggle
# 1行選択
bind-key -T copy-mode-vi V    send-keys -X select-line

# Vi モード中に Ctrl-a で行頭に（Emacs ライク）
bind-key -T copy-mode-vi C-a  send-keys -X start-of-line
# Vi モード中に Ctrl-e で行末に（Emacs ライク）
bind-key -T copy-mode-vi C-e  send-keys -X end-of-line

# 単語の最初の1文字に移動
bind-key -T copy-mode-vi w    send-keys -X next-word
# 単語の最後の1文字に移動
bind-key -T copy-mode-vi e    send-keys -X next-word-end
# w の逆の動き back
bind-key -T copy-mode-vi b    send-keys -X previous-word

# 画面上に映る最上行に移動
bind-key -T copy-mode-vi g    send-keys -X top-line
# 画面上に映る最下行に移動
bind-key -T copy-mode-vi G    send-keys -X bottom-line

# 前方検索
# bind-key -T copy-mode-vi /    send-keys -X search-forward
# 後方検索
# bind-key -T copy-mode-vi ?    send-keys -X search-backward

# ページスクロール
bind-key -T copy-mode-vi C-u   send-keys -X page-up
bind-key -T copy-mode-vi C-d   send-keys -X page-down
# ページ送り
bind-key -T copy-mode-vi C-n   send-keys -X scroll-up
bind-key -T copy-mode-vi C-f   send-keys -X scroll-down

# Prefix+v でコピーモード開始
#bind-key v copy-mode \; display "Copy mode!"
bind-key -T copy-mode-vi v     send-keys -X begin-selection

# Prefix+Enter/y でコピー
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
# bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# # Prefix+p でペースト
# クリップボードにも保存されているので Cmd-v でもペースト可能
bind-key p paste-buffer

# # vim <=> tmux 間でクリップボード利用を可能にする
# set-option -g default-command "reattach-to-user-namespace -l $SHELL"
#
# ウィンドウとペインの番号を1から開始する（デフォルト0）
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Alt+|/- でペイン分割（プレフィックスなし）
bind-key -n M-| split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

# Alt+n/p でウィンドウ切り替え（プレフィックスなし）
bind-key -n M-p select-window -t :-
bind-key -n M-n select-window -t :+

# Alt+hjkl でペイン移動（プレフィックスなし）
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Alt+HJKL でペインリサイズ（プレフィックスなし）
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# Prefix Ctrl-O のPane切り替えを無効化
unbind-key -T prefix C-O

# ディレクトリ引き継ぎ
bind c new-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"
