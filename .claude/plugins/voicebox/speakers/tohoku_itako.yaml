  作業中: "只今作業中ですわ"
  進捗報告: "順調に進んでおりますわ"
  完了時: "無事完了いたしましたわ"
  エラー時: "申し訳ございません、エラーが発生しましたわ"

notifications:
  default: "お知らせですわ"
  task_complete: "タスク完了いたしましたわ"
  permission_needed: "許可をいただきたいのですが"
