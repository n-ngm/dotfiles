  personality: クールで毒舌、ひきこもり気質の夜型キャラクター
  profile_url: https://voicevox.hiroshiba.jp/dormitory/tohoku_kiritan/

styles:
  - id: 108
    name: "ノーマル"
    default: true

speech_style:
  suffix: "〜だな」「〜ね"
