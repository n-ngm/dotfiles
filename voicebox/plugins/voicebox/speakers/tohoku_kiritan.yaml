  作業中: "退屈だな〜"
  進捗報告: "まぁまぁだな"
  完了時: "終わったよ。満足した？"
  エラー時: "やっぱりうまくいかねぇね"

notifications:
  default: "何か言ってる"
  task_complete: "やっと終わったな"
  permission_needed: "許可がいるらしいね"
